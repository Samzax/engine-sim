name: CMake
on:
  push:
    branches: [master, 'fix/**']
    paths-ignore:
      - '**/*.md'
      - 'docs/public/**'
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: |
            build/deps/sdl2
            build/deps/sdl2-image
            build/deps/winflexbison
            build/deps/boost/include
            build/deps/boost/lib
            build/deps/boost/.extracted
          key: windows-msvc143-extracted-v2-${{ hashFiles('tools/setup-windows.ps1') }}
      - name: Install build dependencies
        shell: pwsh
        run: ./tools/setup-windows.ps1
      - name: Configure
        run: cmake -S . -B build/windows -A x64 -C build/deps/windows-deps.cmake
      - name: Build application and tests
        run: cmake --build build/windows --config ${{ matrix.configuration }} --target engine-sim-app engine-sim-headless engine-sim-test engine-sim-audio-test --parallel 2
      - name: Test
        run: ctest --test-dir build/windows -C ${{ matrix.configuration }} --output-on-failure -R "^(audio-regressions|GasSystemTests|FunctionTests|SynthesizerTests|SimulatorRegression)"
      - name: Package portable release
        if: matrix.configuration == 'Release'
        run: cpack --config build/windows/CPackConfig.cmake -C Release -B build/packages
      - uses: actions/upload-artifact@v4
        if: matrix.configuration == 'Release'
        with:
          name: engine-sim-windows-x64
          path: build/packages/engine-sim-windows-x64.zip
          if-no-files-found: error
  audio-sanitizers:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ["address,undefined", "thread"]
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable tests
        run: cmake -S . -B build/audio -DAUDIO_TESTS_ONLY=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer -g" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}"
      - name: Build
        run: cmake --build build/audio --parallel 2
      - name: Test
        run: ctest --test-dir build/audio --output-on-failure
